<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quest CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: un CRM con cabina de mando de videojuego. Rail de navegación, HUD de nivel arriba, tablero kanban como mapa de misión. Dark-first. */
:root{--bg:#0b0c14;--panel:#141626;--panel2:#1b1e33;--line:#272b45;--fg:#eef0fb;--muted:#9aa0c2;--cy:#00c2ff;--vi:#8b5cf6;--pk:#e8699a;--good:#3ddc97;--warn:#f5b84b;--bad:#ef6b8a;--ring:#2a2f4d;--shadow:0 18px 50px rgba(0,0,0,.45);--fd:'Unbounded','Trebuchet MS',sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4fa;--panel:#ffffff;--panel2:#eef0f9;--line:#dcdff0;--fg:#14162b;--muted:#5b6188;--cy:#0079b8;--vi:#6d3fe0;--pk:#c4306a;--good:#0f9d6b;--warn:#b87400;--bad:#c8365a;--ring:#e2e5f4;--shadow:0 18px 50px rgba(30,35,80,.16);color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f4fa;--panel:#ffffff;--panel2:#eef0f9;--line:#dcdff0;--fg:#14162b;--muted:#5b6188;--cy:#0079b8;--vi:#6d3fe0;--pk:#c4306a;--good:#0f9d6b;--warn:#b87400;--bad:#c8365a;--ring:#e2e5f4;--shadow:0 18px 50px rgba(30,35,80,.16);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(900px 480px at 88% -8%,color-mix(in srgb,var(--vi) 16%,transparent),transparent),radial-gradient(700px 400px at 0% 110%,color-mix(in srgb,var(--cy) 10%,transparent),transparent);background-attachment:fixed;color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:92px minmax(0,1fr);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;gap:20px}
.rail{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 8px}
.logo{font-family:var(--fd);font-weight:700;font-size:15px;text-align:center;padding:6px 0 12px;letter-spacing:.02em;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;border-radius:14px;padding:10px 4px;color:var(--muted);font-size:12px;font-weight:600}
.nav svg{width:24px;height:24px}
.nav:hover{color:var(--fg);background:var(--panel2)}
.nav[aria-current="page"]{color:var(--fg);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.nav[aria-current="page"] svg{color:var(--cy)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 20px}
.medal{width:64px;height:72px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--cy),var(--vi) 55%,var(--pk));font-family:var(--fd);font-weight:700;font-size:24px;color:#fff}
.medal.up{animation:pop .8s ease}
@keyframes pop{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.96)}}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl-t{font-family:var(--fd);font-weight:500;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lvl-t small{font-family:var(--fb);font-size:13px;color:var(--muted);font-weight:500}
.xpbar{height:12px;border-radius:99px;background:var(--ring);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.quests{display:flex;flex-direction:column;gap:6px;min-width:210px}
.quests h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500}
.q .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.q.done{color:var(--muted);text-decoration:line-through}
.q.done .dot{background:var(--good);border-color:var(--good);color:#06130c}
.q.done .dot svg{width:12px;height:12px;stroke-width:3}
.q b{font-variant-numeric:tabular-nums;margin-left:auto;color:var(--muted);font-weight:600}
.view[hidden]{display:none!important}
.ttl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.ttl h1{margin:0;font-family:var(--fd);font-weight:500;font-size:22px}
.ttl p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--cy)}
.btn.pri{border:0;color:#fff;background:linear-gradient(90deg,var(--vi),var(--pk))}
.btn.pri:hover{filter:brightness(1.1)}
.btn.bad{color:var(--bad)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;margin-top:14px;scrollbar-width:thin}
.col{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:420px}
.col.over{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 25%,transparent)}
.col-h{padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px}
.col-h div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h h2{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.col-h .n{font-family:var(--fd);font-size:13px;color:var(--muted)}
.col-h small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:10px;padding:4px 10px 12px;flex:1}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:20px 10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--cy) 60%,var(--line))}
.card.dragging{opacity:.45}
.card b{display:block;font-weight:700;overflow-wrap:anywhere}
.card span.co{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.chip{font-variant-numeric:tabular-nums;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px}
.adv{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:32px;height:30px;display:grid;place-items:center;color:var(--muted)}
.adv:hover{color:var(--cy);border-color:var(--cy)}
.ringw{position:relative;width:46px;height:46px}
.ringw svg{width:46px;height:46px;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:5}
.ringw .bg{stroke:var(--ring)}
.ringw .fg{stroke-linecap:round;transition:stroke-dashoffset .6s}
.ringw span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.ringw.big{width:92px;height:92px}.ringw.big svg{width:92px;height:92px}.ringw.big span{font-size:22px;font-family:var(--fd)}
.hi .fg{stroke:var(--good)}.md .fg{stroke:var(--warn)}.lo .fg{stroke:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi strong{font-family:var(--fd);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;color:var(--muted);font-size:12.5px}
.two{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-top:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.box h2{margin:0 0 12px;font-size:15px;font-weight:700}
.box p.note{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.fun{display:flex;flex-direction:column;gap:9px}
.fr{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13.5px}
.fr .bar{height:26px;background:var(--panel2);border-radius:8px;overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cy),var(--vi));min-width:4px;transition:width .6s}
.fr b{font-variant-numeric:tabular-nums;text-align:right}
.hist{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--muted)}
.hist i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--pk),var(--vi));min-height:3px}
.hist b{color:var(--fg)}
.mission{display:flex;gap:14px;align-items:center}
.mission .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--cy),var(--vi));display:grid;place-items:center;color:#fff;flex:none}
.mission .ic svg{width:24px;height:24px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14px}
.list button{background:none;border:0;padding:0;text-align:left;font-weight:600}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crit:last-of-type{border:0}
.crit small{display:block;color:var(--muted);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--vi)}
.crit output,.pw output{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.pw{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.bdg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bdg .hex{width:54px;height:60px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--cy),var(--vi),var(--pk));color:#fff}
.bdg .hex svg{width:26px;height:26px}
.bdg h3{margin:0;font-size:15px}
.bdg p{margin:0;color:var(--muted);font-size:13px}
.bdg.lock .hex{background:var(--panel2);color:var(--muted)}
.bdg.lock{opacity:.8}
.bdg.lock h3{color:var(--muted)}
.lad{display:flex;flex-direction:column;gap:6px}
.lad div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);font-size:14px}
.lad div.on{box-shadow:inset 0 0 0 1px var(--cy)}
.lad b{font-family:var(--fd);font-weight:500}
.lad span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules svg{color:var(--good);margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(5,6,12,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.drawer.on{transform:none}
.dh{display:flex;gap:14px;align-items:center}
.dh>div:nth-child(2){flex:1;min-width:0}
.dh h2{margin:0;font-family:var(--fd);font-weight:500;font-size:19px;overflow-wrap:anywhere}
.dh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;color:var(--fg);font-weight:500}
textarea{resize:vertical;min-height:74px}
select:focus,input:focus,textarea:focus{border-color:var(--cy)}
.why{display:flex;flex-direction:column;gap:7px;font-size:13px}
.why div{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center}
.why i{display:block;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--cy),var(--vi))}
.why .tr{background:var(--ring);border-radius:6px}
.why b{text-align:right;font-variant-numeric:tabular-nums}
.emp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.modal{position:fixed;z-index:32;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none;opacity:0;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.modal form{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h2{margin:0;font-family:var(--fd);font-weight:500;font-size:18px}
#toasts{position:fixed;z-index:40;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 28px));pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;animation:ti .35s cubic-bezier(.2,.8,.2,1)}
.toast .xp{font-family:var(--fd);font-size:13px;color:var(--cy);white-space:nowrap}
.toast.badge{border-color:var(--vi)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes ti{from{opacity:0;transform:translateY(-12px) scale(.96)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
.tag{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-weight:600;vertical-align:middle}

.col{border-top:3px solid var(--c,var(--line))}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--fb)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--cy);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:url(#ga)}
.chart .dot{fill:var(--cy);stroke:var(--bg);stroke-width:2}
.chart .dn{fill:none;stroke-width:16;transform:rotate(-90deg);transform-origin:60px 60px}
.chart .bgc{stroke:var(--ring)}
.chart .dv{fill:var(--fg);font-size:15px;font-family:var(--fd);font-weight:500}
.chart .zone{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good);stroke-dasharray:4 4;stroke-opacity:.5}
.chart .zt{fill:var(--good);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.chart .sc{stroke:var(--bg);stroke-width:2;cursor:pointer}
.chart .sc:hover,.chart .sc:focus{stroke:var(--fg)}
.chart .rg{fill:none;stroke:var(--line)}
.chart .rw{fill:color-mix(in srgb,var(--vi) 18%,transparent);stroke:var(--vi);stroke-width:2;stroke-dasharray:5 4}
.chart .ra{fill:color-mix(in srgb,var(--cy) 30%,transparent);stroke:var(--cy);stroke-width:2.5}
.donut{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:16px;align-items:center}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center;margin-top:8px}
.leg.col1{flex-direction:column;align-items:flex-start;margin:0;gap:8px;font-size:13.5px;color:var(--fg)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.leg i.sq{width:14px;height:14px;margin:0}
.leg i.sq.rwl{background:color-mix(in srgb,var(--vi) 40%,transparent);border:2px dashed var(--vi)}
.leg i.sq.ral{background:color-mix(in srgb,var(--cy) 50%,transparent);border:2px solid var(--cy)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .hl{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.heat i{display:block;height:30px;border-radius:8px;background:var(--panel2)}
.leg i.sq{display:inline-block;width:16px;height:16px;border-radius:4px;margin:0;background:var(--panel2)}
.heat i.l1,.leg i.sq.l1{background:color-mix(in srgb,var(--vi) 30%,var(--panel2))}
.heat i.l2,.leg i.sq.l2{background:color-mix(in srgb,var(--vi) 60%,var(--panel2))}
.heat i.l3,.leg i.sq.l3{background:color-mix(in srgb,var(--pk) 85%,var(--panel2))}
.heat i.f{background:transparent;border:1px dashed var(--line)}
.heat i.t{outline:2px solid var(--cy);outline-offset:1px}
.gbar{height:18px;border-radius:99px;background:var(--ring);position:relative;overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s}
.gbar .fc{background:color-mix(in srgb,var(--vi) 40%,transparent)}
.gbar .wn{background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk))}
.gnum{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.gnum b{color:var(--fg)}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px;background:var(--panel2);border-radius:8px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));border-radius:8px;min-width:3px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--vi),var(--pk));color:#fff;font-family:var(--fd);font-size:12px;margin-right:10px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:230px;line-height:1.5}
.drop{display:flex;gap:12px;align-items:center;margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--muted)}

 else if(a==='parseimp'){runImp()}
 else if(a==='achtab'){ACH=t.dataset.t;renderAch()}
 else if(a==='claim'){claim(t.dataset.k)}
 else if(a==='chest'){chest(t.dataset.w==='1')}
 else if(a==='markbadge'){var cb=S.custom.filter(function(x){return x.id===t.dataset.id})[0];if(cb&&!S.badges[cb.id]){S.badges[cb.id]=true;award(10,'Insignia propia: '+cb.n);burst(50);save();renderAch()}}
 else if(a==='delbadge'){if(t.dataset.sure){S.custom=S.custom.filter(function(x){return x.id!==t.dataset.id});delete S.badges[t.dataset.id];save();renderAch()}else{t.dataset.sure=1;t.textContent='¿Seguro? Pulsa otra vez'}}
 else if(a==='copyicp'){var ok2=function(){toast('Prompt copiado')},ta2=$('#icp-prompt');try{navigator.clipboard.writeText(icpPrompt()).then(ok2,function(){ta2.select();toast('Selecciona y copia con Ctrl+C')})}catch(x){ta2.select();toast('Selecciona y copia con Ctrl+C')}}
 else if(a==='applyicp'){applyIcp()}
 else if(a==='sampleimp'){IMP.text=SAMPLE;$('#imp-text').value=SAMPLE;runImp()}
 else if(a==='applyimp'){applyImp()}
 else if(a==='astext'){var l0=find(+IMP.target);if(l0){l0.notes=(l0.notes?l0.notes+'\n\n':'')+IMP.text.trim().slice(0,1200);IMP.text='';IMP.err='';save();toast('Texto guardado en las notas');show('board');openLead(l0.id)}}
 else if(a==='open'){if(e.target.closest('.adv'))return;openLead(+t.dataset.id)}
 else if(a==='adv'){e.stopPropagation();var l=find(+t.dataset.id);moveLead(l.id,STAGES[Math.min(4,sIx(l.stage)+1)].id)}
 else if(a==='newlead'){$('#modal').classList.add('on');$('#scrim').classList.add('on');setTimeout(function(){$('#nl-name').focus()},50)}
 else if(a==='closemodal'||a==='close'){closeAll()}
 else if(a==='log'){var l2=find(openId);dayCheck();S.acts++;if(S.actDay.n<5){S.actDay.n++;award(5,'Actividad registrada con '+l2.name);quest('acts')}else{bump('acts',1);toast('Actividad registrada. Hoy ya has ganado el máximo de XP por esto.')}badges();save();renderHUD()}
 else if(a==='del'){if(t.dataset.sure){S.leads=S.leads.filter(function(x){return x.id!==openId});toast('Lead eliminado');save();closeAll()}else{t.dataset.sure=1;t.textContent='¿Seguro? Pulsa otra vez'}}
 else if(a==='reset'){if(t.dataset.sure){S=seed();save();toast('Demo reiniciada');renderAll();show('ach')}else{t.dataset.sure=1;t.textContent='¿Seguro? Se pierde tu progreso'}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();openLead(+e.target.dataset.id)}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.tg){var id=t.dataset.tg,c=WCH.concat(MCH).filter(function(x){return x[0]===id})[0],mx=c[2]==='full'?100:c[3]*3,v=Math.min(mx,Math.max(Math.ceil(c[3]/2),Math.round(+t.value)||c[3]));S.targets[id]=v;save();renderAch()}
 else if(t.id==='cb-m'){$('#cb-tl').hidden=t.value==='manual'}
 else if(t.id==='imp-target'){IMP.target=t.value;if(IMP.items)runImp()}
 else if(t.id==='imp-over'){IMP.over=t.checked;prevImp()}
 else if(t.dataset.ix!==undefined){IMP.items[+t.dataset.ix].on=t.checked;prevImp()}
 else if(t.id==='imp-file'){readFile(t.files&&t.files[0]);t.value=''}
 else if(t.id==='goal'){S.goal=Math.max(0,+t.value||0);save();renderDash()}
 else if(t.id==='d-st'){moveLead(openId,t.value,true);var l=find(openId);if(l)refreshDrawer(l)}
 else if(t.id==='d-fo'){find(openId).follow=t.value;save()}
 else if(t.id==='d-va'){find(openId).value=Math.max(0,+t.value||0);save()}
 else if(t.dataset.crit!==undefined){var l3=find(openId),i=+t.dataset.crit;l3.a[i]=t.value===''?null:+t.value;if(t.value!==''&&!l3.critOk[CRIT[i].id]){l3.critOk[CRIT[i].id]=true;award(3,'Criterio respondido')}refreshDrawer(l3);badges();save();renderHUD()}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='cb-name'){$('#cb-prev').innerHTML=genIcon(t.value||'x')}
 else if(t.id==='icp-text'){ICPI.text=t.value}
 else if(t.dataset.icp){S.icpCard[t.dataset.icp]=t.value;save()}
 else if(t.id==='imp-text'){IMP.text=t.value}
 else if(t.dataset.emp){var l=find(openId),k=t.dataset.emp;l.emp[k]=t.value;var ok=t.value.trim().length>=8;if(ok&&!l.empOk[k]){l.empOk[k]=true;award(8,'Cuadrante de empatía completado');quest('emp');if(empN(l)===6&&!l.empFull){l.empFull=true;award(20,'Mapa de empatía completo')}}refreshDrawer(l);badges();save();renderHUD()}
 else if(t.id==='d-no'){find(openId).notes=t.value;badges();save()}
 else if(t.dataset.w!==undefined){S.weights[+t.dataset.w]=+t.value;S.flags.icp=1;var tw=S.weights.reduce(function(a,b){return a+b},0)||1;S.weights.forEach(function(w,i){var o=$('#wo'+i);if(o)o.textContent=Math.round(100*w/tw)+'%'});badges();save();renderHUD()}
 else if(t.dataset.p!==undefined){S.probs[+t.dataset.p]=+t.value;$('#po'+t.dataset.p).textContent=t.value+'%';save()}});
$('#newform').addEventListener('submit',function(e){e.preventDefault();var n=$('#nl-name').value.trim(),c=$('#nl-co').value.trim();if(!n||!c)return;addLead(n,c,Math.max(0,+$('#nl-val').value||0));e.target.reset();$('#nl-val').value=1190;closeAll()});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('on');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];readFile(f)});
document.addEventListener('submit',function(e){if(e.target.id!=='cbform')return;e.preventDefault();if(S.custom.length>=12)return;var n=$('#cb-name').value.trim().slice(0,30),m=$('#cb-m').value;if(!n)return;S.custom.push({id:'c'+((S.cid=(S.cid||0)+1)),n:n,d:$('#cb-d').value.trim().slice(0,80),m:m,t:Math.max(1,+$('#cb-t').value||1),manual:m==='manual'});toast('Insignia creada: '+n);after();renderAch()});
/* arrastrar y soltar */
var dragId=null;
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=+c.dataset.id;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',String(dragId));e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;document.querySelectorAll('.dragging,.over').forEach(function(n){n.classList.remove('dragging','over')})});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col');if(!c||dragId===null)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(function(n){if(n!==c)n.classList.remove('over')});c.classList.add('over')});
document.addEventListener('drop',function(e){var c=e.target.closest&&e.target.closest('.col');if(!c||dragId===null)return;e.preventDefault();var id=dragId;dragId=null;moveLead(id,c.dataset.stage)});
if(!S.init){BADGES.forEach(function(b){if(b.c(S))S.badges[b.id]=true});S.init=1}
if(!S.tinit){TIERS.forEach(function(t){var v=metric(t.m),lv=0;t.lv.forEach(function(x){if(v>=x)lv++});S.tier[t.id]=lv});S.tinit=1}
renderAll();save();
})();
</script>

</body>
</html>
